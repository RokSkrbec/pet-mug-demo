<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Mug Customizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Fredoka:wght@500;600&family=Lobster&family=Mountains+of+Christmas:wght@700&family=Pacifico&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="demo-header">
      <h1>Christmas mug with your pet</h1>
      <p>Upload a photo, the background is removed automatically in your browser. Add hats, scarves, lights and names.</p>
    </header>
    <main id="customizer"></main>

    <dialog id="cart-dialog">
      <h2>Added to cart (demo)</h2>
      <img alt="Design preview" />
      <p>Line item sent to Shopify <code>/cart/add.js</code>:</p>
      <pre></pre>
      <form method="dialog"><button class="pc-btn">Close</button></form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
