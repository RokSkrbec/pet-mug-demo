<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Gift Customizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Parisienne&family=Pinyon+Script&family=Imperial+Script&family=Alex+Brush&family=Style+Script&family=Yellowtail&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="demo-header">
      <h1>Christmas gifts with your pet</h1>
      <p>Upload a photo of your pet and we'll paint it as a Christmas watercolor for your mug, pillow or t-shirt.</p>
    </header>
    <main id="customizer"></main>

    <dialog id="cart-dialog">
      <h2>Added to cart (demo)</h2>
      <img alt="Design preview" />
      <p>Line item sent to Shopify <code>/cart/add.js</code>:</p>
      <pre></pre>
      <form method="dialog"><button class="pc-btn">Close</button></form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
